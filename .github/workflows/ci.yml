name: CI

on:
  push:
    branches: [master, main, dev, "feature/**", "feat/**", "release/**"]
  pull_request:
    branches: [master, main, dev]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync locked dependencies
        run: python -m uv sync --extra dev --locked --python ${{ matrix.python-version }}

      - name: Run Ruff
        run: python -m uv run ruff check .

      - name: Run mypy
        run: python -m uv run mypy

      - name: Run unit tests with coverage
        env:
          OTEL_TRACING_ENABLED: "false"
        run: python -m uv run pytest tests/ --ignore=tests/test_integration.py --cov --cov-report=term-missing -v --tb=short

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.11-
            ${{ runner.os }}-uv-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync locked dependencies
        run: python -m uv sync --extra dev --locked --python 3.11

      - name: Run security tests
        env:
          OTEL_TRACING_ENABLED: "false"
        run: python -m uv run pytest tests/test_security.py tests/test_upload_security.py tests/test_quota.py -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Enforce frontend lockfile policy
        working-directory: frontend
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "frontend/pnpm-lock.yaml exists but repository policy is npm-only for frontend dependencies"
            echo "Please remove frontend/pnpm-lock.yaml and keep frontend/package-lock.json"
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "frontend/package-lock.json is missing. This repo expects npm lockfile-driven installs"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
