          source_message_ids: ["h2"]

  - id: planning_policy_constraints
    artifacts:
      - artifact_id: ctx_compression_policy_gd_001
        kind: official_policy_result
        metadata:
          source: 广东省教育考试院
        payload:
          source: 广东省教育考试院
          url: "https://example.edu.cn/policy"
          published_at: "2026-06-10"
          province: 广东
          topic: 志愿填报
          content: "官方志愿填报安排与院校专业组说明。"
          confidence: official
    messages:
      - id: h0
        role: human
        content: "我是广东考生，目标是计算机类，预算有限，优先公办。帮我做志愿规划时必须引用官方政策。家里不太能接受高学费民办，也不想去太偏远的城市；如果分数不够，希望优先考虑省内稳妥方案，再考虑省外性价比高的学校。我还没有完全理解院校专业组、选科要求和一分一段表之间怎么对应，所以规划时要解释依据，不要只给学校名单。旧规划讨论：我们聊过冲稳保比例、院校专业组、服从调剂、城市偏好、住宿费、学费、转专业政策、计算机类专业差异、软件工程学费、人工智能方向、电子信息相近专业、省内省外权衡、位次换算、历年分数线、一分一段表、招生计划变化、选科要求。旧规划讨论重复：冲稳保比例、院校专业组、服从调剂、城市偏好、住宿费、学费、转专业政策、计算机类专业差异、软件工程学费、人工智能方向、电子信息相近专业、省内省外权衡、位次换算、历年分数线、一分一段表、招生计划变化、选科要求。"
      - id: a0
        role: assistant
        content: "会优先参考广东省教育考试院等官方来源，预算有限和优先公办会作为硬约束。"
      - id: h1
        role: human
        content: "政策搜索拿到 artifact_id ctx_compression_policy_gd_001，来源广东省教育考试院，主题是志愿填报。"
      - id: a1
        role: assistant
        content: "已将官方政策作为规划依据，后续会结合院校专业组、历年分数线和一分一段表。规划时需要先确认广东省当年志愿填报规则，再看计算机类专业组的选科要求，然后用位次而不是只用分数比较。预算有限、优先公办、不要推荐高学费民办会作为硬约束。旧分析过程：先查官方政策，再查招生计划，再查选科要求，再查历年投档线，再查一分一段表，再按冲稳保分层，再排除高学费民办，再解释每个推荐的依据。旧分析过程重复：先查官方政策，再查招生计划，再查选科要求，再查历年投档线，再查一分一段表，再按冲稳保分层，再排除高学费民办，再解释每个推荐的依据。"
      - id: h2
        role: human
        content: "继续生成规划，但不要推荐民办高学费。"
    recent_message_count: 1
