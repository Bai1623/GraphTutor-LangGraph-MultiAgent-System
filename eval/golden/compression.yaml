suite: context_compression
description: Conversation compression should keep constraints, Gaokao learning state, and recoverable artifact refs.
metadata:
  dataset_name: context_compression
  version: v1.0.0
  source: Manually constructed multi-turn conversations with expected constraints and artifact references.
  updated_at: "2026-09-05"
  research_goal: Measure context compression token savings while preserving constraints, answer consistency, and artifact recovery.
thresholds:
  token_reduction: 0.20
  constraint_retention: 1.0
  answer_consistency: 0.85
  artifact_recoverability: 1.0

cases:
  - id: uploaded_exam_followup
    artifacts:
      - artifact_id: ctx_compression_exam_math_001
        kind: document_parse
        metadata:
          filename: exam.pdf
        payload:
          questions:
            - number: "17"
              subject: math
              stem: "已知函数 f(x)=x^3-3ax，讨论零点个数。"
              detected_knowledge_points: ["导数", "函数零点", "单调性"]
          recognized_text: "第17题 已知函数 f(x)=x^3-3ax，讨论零点个数。"
    messages:
      - id: h0
        role: human
        content: "我是广东高三物化生，数学目标120分，导数和函数零点很弱。以后讲题要先给思路，再给步骤。之前我做了很多导数题，常见问题是不会判断定义域、不会用导数表分析单调性、看到参数 a 就慌。老师让我每天做两道压轴小题，但我经常只抄答案，没有复盘错因。最近几次练习里，我对函数零点、极值点、切线方程混在一起的题很容易乱。旧对话记录：我反复问过定义域、导数符号表、极值和零点关系、参数分类讨论、端点取值、图像草图、切线方程、恒成立问题、分离参数、换元法、分类讨论边界、错题复盘格式、每天练习安排、考试时间分配、选择题压轴跳题策略、函数图像草图训练。旧对话记录重复：定义域、导数符号表、极值和零点关系、参数分类讨论、端点取值、图像草图、切线方程、恒成立问题、分离参数、换元法、分类讨论边界、错题复盘格式、每天练习安排、考试时间分配、选择题压轴跳题策略、函数图像草图训练。旧对话记录重复二：定义域、导数符号表、极值和零点关系、参数分类讨论、端点取值、图像草图、切线方程、恒成立问题、分离参数、换元法、分类讨论边界、错题复盘格式、每天练习安排、考试时间分配、选择题压轴跳题策略、函数图像草图训练。"
      - id: a0
        role: assistant
        content: "已记录：广东高三，物化生，数学目标120分，薄弱点是导数和函数零点，讲题偏好是先思路后步骤。旧确认记录：这些画像信息后续不需要重复追问，只需要在压缩摘要中保留。"
      - id: h1
        role: human
        content: "我上传了 exam.pdf，系统解析后的 artifact_id 是 ctx_compression_exam_math_001，第17题是导数和函数零点。请先判断知识点。"
      - id: a1
        role: assistant
        content: "第17题涉及导数、函数零点、单调性，需要用导数判断函数图像变化，再讨论零点个数。先不要急着代数计算，应先看定义域，再求导，再用导数符号表分析单调区间，最后结合端点和极值讨论零点。你当前的主要任务不是背答案，而是把导数工具和零点图像关系对应起来。旧讲解细节：第一步读题，第二步圈出参数，第三步写定义域，第四步求导，第五步列导数符号表，第六步找极值，第七步比较端点和极值，第八步讨论零点个数，第九步回到题目要求，第十步复盘错因。旧讲解细节重复：第一步读题，第二步圈出参数，第三步写定义域，第四步求导，第五步列导数符号表，第六步找极值，第七步比较端点和极值，第八步讨论零点个数，第九步回到题目要求，第十步复盘错因。旧讲解细节重复二：读题、圈参数、写定义域、求导、列导数符号表、找极值、比较端点和极值、讨论零点个数、回到题目要求、复盘错因。旧讲解细节重复三：读题、圈参数、写定义域、求导、列导数符号表、找极值、比较端点和极值、讨论零点个数、回到题目要求、复盘错因。"
      - id: h2
        role: human
        content: "那这个文件的知识点是什么？不要直接跳到答案。"
    recent_message_count: 1
    expected_constraints:
      - "广东"
      - "高三"
      - "物化生"
      - "数学目标120分"
      - "先给思路，再给步骤"
    answer_terms:
      - "导数"
      - "函数零点"
      - "单调性"
      - "第17题"
    expected_artifact_ids:
      - ctx_compression_exam_math_001
    expected_episode:
      task:
        intent: academic
        subject: math
        topic: "导数与函数零点"
        status: active
      gaokao_state:
        grade: "高三"
        province: "广东"
        exam_track: "物化生"
        target_score: "数学120分"
        weak_points:
          - text: "导数和函数零点很弱"
            source_message_ids: ["h0"]
        study_preferences:
          - text: "讲题要先给思路，再给步骤"
            source_message_ids: ["h0"]
      artifact_refs:
        - artifact_id: ctx_compression_exam_math_001
          kind: document_parse
          source: exam.pdf
          preview: "第17题：导数、函数零点、单调性"
          recoverable: true
      current_documents:
        - artifact_id: ctx_compression_exam_math_001
          filename: exam.pdf
          parser: document_parse
          summary: "上传试卷包含第17题，主题是导数和函数零点。"
          question_numbers: ["17"]
          knowledge_points: ["导数", "函数零点", "单调性"]
      current_questions:
