          artifact_id: ctx_compression_exam_math_001
      constraints:
        - text: "讲题要先给思路，再给步骤"
          source_message_ids: ["h0"]
        - text: "学生是广东高三物化生，数学目标120分"
          source_message_ids: ["h0"]
      knowledge_progress:
        - text: "第17题涉及导数、函数零点、单调性"
          source_message_ids: ["a1"]
      open_loops:
