suite: quality_gate
kind: quality_gate
description: Fixed release gate for core Agent/RAG quality signals.
metadata:
  dataset_name: core_quality_gate
  version: v1.0.0
  source: Release policy aggregating the routing, RAG, and hallucination golden datasets.
  updated_at: "2026-09-05"
  research_goal: Define reproducible release thresholds for the core Agent and RAG quality signals.
sub_suites:
  - routing
  - rag
  - hallucination
thresholds:
  overall_pass_rate: 1.0
  routing_accuracy: 0.90
  rag_recall_at_k: 0.85
  rag_mrr: 0.70
  rag_hit_rate: 0.85
  hallucination_pass_rate: 0.90
