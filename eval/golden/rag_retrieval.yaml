    subject: english
    topic: reading
    query_type: method
    difficulty: medium
    expected_sources:
      - 2025高考英语知识点（Ⅲ）阅读理解专项
  - id: english_application_letter_template
    query: 高考英语应用文建议信邀请信申请信模板
