    query_type: concept
    difficulty: medium
    expected_sources:
      - 2025高考英语知识点（Ⅰ）语法体系
  - id: english_attributive_clause
    query: 定语从句关系代词和关系副词高考怎么考
    subject: english
    topic: grammar
    query_type: concept
    difficulty: medium
    expected_sources:
